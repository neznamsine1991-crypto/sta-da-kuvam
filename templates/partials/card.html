<article class="card">{% if recipe.image %}<img class="recipe-image" src="{{ recipe.image.url }}" alt="{{ recipe.image_alt|default:recipe.title }}">{% else %}<div class="image-placeholder">🍽️</div>{% endif %}<div class="card-body"><p class="muted">{{ recipe.category }}</p><h3><a href="{{ recipe.get_absolute_url }}">{{ recipe.title }}</a></h3><div class="stats"><span>{{ recipe.calories }} kcal</span><span>{{ recipe.protein }}g proteina</span><span>{{ recipe.total_time }} min</span></div></div></article>
