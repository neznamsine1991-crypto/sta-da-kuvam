{% extends "base.html" %}{% block title %}Recepti | Šta Da Kuvam?{% endblock %}{% block content %}<h1>Pronađi nešto ukusno.</h1><form class="filters"><input name="q" value="{{ q }}" placeholder="Piletina, testenina, brz ručak..."><select name="category"><option value="">Sve kategorije</option>{% for cat in categories %}<option value="{{ cat.slug }}">{{ cat.name }}</option>{% endfor %}</select><select name="sort"><option value="newest" {% if sort == "newest" %}selected{% endif %}>Najnovije</option><option value="name" {% if sort == "name" %}selected{% endif %}>Naziv A–Z</option><option value="calories" {% if sort == "calories" %}selected{% endif %}>Najmanje kalorija</option><option value="protein" {% if sort == "protein" %}selected{% endif %}>Najviše proteina</option><option value="time" {% if sort == "time" %}selected{% endif %}>Najbrža priprema</option></select><input name="max_time" type="number" placeholder="Max minuta"><input name="min_protein" type="number" placeholder="Min proteina"><button>Filtriraj</button></form><div class="grid">{% for recipe in recipes %}{% include "partials/card.html" %}{% empty %}<p>Nema recepta koji odgovara pretrazi.</p>{% endfor %}</div>{% endblock %}
